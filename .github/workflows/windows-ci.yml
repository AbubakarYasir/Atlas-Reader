name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Qt's Windows kit is MSVC 2022 x64. Keep the runner generation pinned so
    # windows-latest cannot silently move Atlas to a different VS toolset.
    runs-on: windows-2022
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inherited qualification scripts and N1 shell contract
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $files = @(
            'tools/bench/measure-windows-shell.ps1',
            'tools/bench/run-n1-qualification.ps1',
            'tools/bench/run-n1-packaged-qualification.ps1'
          )

          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null

            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell syntax validation failed for $file"
            }

            Write-Host "PowerShell syntax OK: $file"
          }

          # Keep the regression check for the N1 benchmark bug even though N1
          # is now Accepted. Later checkpoints must not silently reintroduce it.
          $tokens = $null
          $parseErrors = $null
          $measureAst = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/bench/measure-windows-shell.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          )
          $getMetricFunction = $measureAst.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and
              $node.Name -eq 'Get-MetricValue'
          }, $true)

          if ($null -eq $getMetricFunction) {
            throw 'Get-MetricValue function not found in measurement script'
          }

          Invoke-Expression $getMetricFunction.Extent.Text
          $emptyMetricResult = Get-MetricValue -Metrics @() -Name 'startup.first_frame_ms'
          if ($null -ne $emptyMetricResult) {
            throw 'Get-MetricValue must return null for an empty live metrics collection'
          }
          Write-Host 'PowerShell runtime contract OK: empty live metric poll'

          # N2 inherits the user-qualified N1 Windows shell configuration. PDF
          # engine experiments do not get to reopen this baseline casually.
          $qtConf = Get-Content 'qt.conf' -Raw
          if ($qtConf -notmatch '(?m)^WindowsArguments\s*=\s*fontengine=gdi\s*$') {
            throw 'qt.conf must retain the Accepted N1 Windows GDI font backend configuration'
          }
          Write-Host 'Inherited N1 Windows font backend config OK: GDI'

      # Accepted N1 public Windows baseline inherited by N2. Candidate-specific
      # PDF probe tooling/dependencies are added explicitly in focused commits.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Report toolchain
        shell: pwsh
        run: |
          cmake --version
          git --version
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          Write-Host "Configuration: ${{ matrix.configuration }}"
          Write-Host 'Checkpoint: N2 PDF engine qualification'

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci-${{ matrix.configuration }}
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DATLAS_PRERELEASE=alpha.2
          -DATLAS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: >-
          cmake --build build/ci-${{ matrix.configuration }}
          --config ${{ matrix.configuration }}
          --parallel

      - name: Test
        shell: pwsh
        run: >-
          ctest --test-dir build/ci-${{ matrix.configuration }}
          -C ${{ matrix.configuration }}
          --output-on-failure

      # This is an engineering smoke artifact for the active N2 branch. It is
      # not the already-Accepted N1 qualification artifact and not a user release.
      - name: Stage N2 Windows engineering artifact
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifact/n2-windows-x64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'docs') | Out-Null

          $exe = Join-Path $PWD 'build/ci-Release/Release/atlas_reader.exe'
          if (-not (Test-Path $exe)) {
            throw "Release executable not found at $exe"
          }

          Copy-Item $exe (Join-Path $stage 'atlas_reader.exe')
          Copy-Item 'qt.conf' (Join-Path $stage 'qt.conf')
          Copy-Item 'docs/N2_PDF_ENGINE_QUALIFICATION_PLAN.md' (Join-Path $stage 'docs/N2_PDF_ENGINE_QUALIFICATION_PLAN.md')
          Copy-Item 'docs/baselines/N2_PDF_ENGINE_MATRIX.md' (Join-Path $stage 'docs/N2_PDF_ENGINE_MATRIX.md')

          $deploy = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          & $deploy --release --qmldir (Join-Path $PWD 'qml') (Join-Path $stage 'atlas_reader.exe')
          if ($LASTEXITCODE -ne 0) {
            throw "windeployqt failed with exit code $LASTEXITCODE"
          }

          @(
            'Atlas Reader Native N2 Windows engineering artifact'
            'Version: 2.0.0-alpha.2'
            'Checkpoint: N2 PDF engine qualification spike'
            'Commit: ${{ github.sha }}'
            'GitHub run: ${{ github.run_id }}'
            'Configuration: Release'
            'Generator: Visual Studio 17 2022 x64'
            'Qt baseline: 6.10.3 MSVC 2022 64-bit'
            'Controls style: compile-time Basic'
            'Inherited Windows font backend: GDI via qt.conf'
            'PDF engine selection: none yet unless a focused N2 probe in this commit says otherwise'
            'Purpose: N2 engineering/CI smoke only; not a user release and not N1 requalification'
          ) | Set-Content -Encoding UTF8 (Join-Path $stage 'N2_BUILD_INFO.txt')

      - name: Upload N2 Windows engineering artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reader-n2-windows-x64-${{ github.sha }}
          path: artifact/n2-windows-x64
          if-no-files-found: error
          retention-days: 14
