name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      ATLAS_IMPLEMENTATION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ATLAS_CHECKOUT_SHA: ${{ github.sha }}

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate inherited qualification scripts and N1 shell contract
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $files = @(
            'tools/bench/measure-windows-shell.ps1',
            'tools/bench/run-n1-qualification.ps1',
            'tools/bench/run-n1-packaged-qualification.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell syntax validation failed for $file"
            }
            Write-Host "PowerShell syntax OK: $file"
          }

          $tokens = $null
          $parseErrors = $null
          $measureAst = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'tools/bench/measure-windows-shell.ps1'), [ref]$tokens, [ref]$parseErrors)
          $getMetricFunction = $measureAst.Find({
            param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-MetricValue'
          }, $true)
          if ($null -eq $getMetricFunction) {
            throw 'Get-MetricValue function not found in measurement script'
          }
          Invoke-Expression $getMetricFunction.Extent.Text
          $emptyMetricResult = Get-MetricValue -Metrics @() -Name 'startup.first_frame_ms'
          if ($null -ne $emptyMetricResult) {
            throw 'Get-MetricValue must return null for an empty live metrics collection'
          }
          Write-Host 'PowerShell runtime contract OK: empty live metric poll'

          $qtConf = Get-Content 'qt.conf' -Raw
          if ($qtConf -notmatch '(?m)^WindowsArguments\s*=\s*fontengine=gdi\s*$') {
            throw 'qt.conf must retain the Accepted N1 Windows GDI font backend configuration'
          }
          Write-Host 'Inherited N1 Windows font backend config OK: GDI'

      - name: Install Qt + Qt PDF probe module
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtpdf'
          cache: true

      - name: Acquire pinned PDFium N2.2 probe package
        shell: pwsh
        run: |
          $url = 'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8066/pdfium-win-x64.tgz'
          $expected = '739a57d597d864297909cc40a2411eba728490c76a0fa25e3ea299c7f6b07020'
          $archive = Join-Path $env:RUNNER_TEMP 'pdfium-win-x64-chromium-8066.tgz'
          $root = Join-Path $env:RUNNER_TEMP 'pdfium-chromium-8066'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "PDFium package SHA-256 mismatch: $actual != $expected"
          }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          tar.exe -xf $archive -C $root
          if ($LASTEXITCODE -ne 0) {
            throw "PDFium package extraction failed with exit code $LASTEXITCODE"
          }
          foreach ($required in @('PDFiumConfig.cmake', 'include/fpdfview.h', 'lib/pdfium.dll.lib', 'bin/pdfium.dll')) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "Pinned PDFium package missing expected path: $required"
            }
          }
          "PDFium_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ATLAS_PDFIUM_ARCHIVE_SHA256=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned PDFium package verified: chromium/8066 -> $actual"

      - name: Report toolchain and evidence identity
        shell: pwsh
        run: |
          cmake --version
          git --version
          Write-Host "Qt root: $env:QT_ROOT_DIR"
          Write-Host "PDFium root: $env:PDFium_DIR"
          Write-Host "PDFium archive SHA-256: $env:ATLAS_PDFIUM_ARCHIVE_SHA256"
          Write-Host "Implementation head SHA: $env:ATLAS_IMPLEMENTATION_SHA"
          Write-Host "Checkout SHA: $env:ATLAS_CHECKOUT_SHA"
          Write-Host "Configuration: ${{ matrix.configuration }}"
          Write-Host 'Checkpoint: N2 PDF engine qualification'
          if (-not (Test-Path (Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6Pdf'))) {
            throw 'Qt PDF CMake package is missing after qtpdf module installation'
          }
          Write-Host 'Qt PDF module available: Qt6Pdf'

      - name: Prepare deterministic generated N2 fixtures
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r tests/fixtures/pdf/requirements-validation.txt
          python tests/fixtures/pdf/source/generate_a006_unicode_semantics.py
          if ($LASTEXITCODE -ne 0) {
            throw "A006 deterministic fixture generation failed with exit code $LASTEXITCODE"
          }
          $expected = 'efe3aa5f9538a8a18af71e4517c9f1e10980db394107c0e16141b03ec7058f0b'
          $path = 'tests/fixtures/pdf/generated/A006_unicode_semantics.pdf'
          $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "A006 generated SHA-256 mismatch: $actual != $expected"
          }
          Write-Host "A006 deterministic fixture verified: $actual"

      - name: Validate N2 synthetic PDF fixtures independently
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          python tests/fixtures/pdf/validate_n2_fixtures.py --output artifacts/n2/fixture-validation.json
          if ($LASTEXITCODE -ne 0) {
            throw "Independent N2 fixture validation failed with exit code $LASTEXITCODE"
          }

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci-${{ matrix.configuration }}
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DPDFium_DIR="$env:PDFium_DIR"
          -DATLAS_ENABLE_PDFIUM_PROBE=ON
          "-DATLAS_PRERELEASE:STRING=alpha.2"
          -DATLAS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: >-
          cmake --build build/ci-${{ matrix.configuration }}
          --config ${{ matrix.configuration }}
          --parallel

      - name: Test
        shell: pwsh
        run: >-
          ctest --test-dir build/ci-${{ matrix.configuration }}
          -C ${{ matrix.configuration }}
          --output-on-failure

      - name: Stage N2 Windows engineering artifact + engine evidence
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $stage = Join-Path $PWD 'artifact/n2-windows-x64'
          $docs = Join-Path $stage 'docs'
          $qtProbeStage = Join-Path $stage 'probes/qt-pdf'
          $pdfiumProbeStage = Join-Path $stage 'probes/pdfium'
          $fixtureStage = Join-Path $stage 'fixtures/pdf'
          $qtEvidence = Join-Path $stage 'evidence/qt-pdf'
          $pdfiumEvidence = Join-Path $stage 'evidence/pdfium'
          New-Item -ItemType Directory -Force -Path $stage, $docs, $qtProbeStage, $pdfiumProbeStage, $fixtureStage, $qtEvidence, $pdfiumEvidence | Out-Null

          $exe = Join-Path $PWD 'build/ci-Release/Release/atlas_reader.exe'
          $qtProbe = Join-Path $PWD 'build/ci-Release/Release/atlas_qt_pdf_probe.exe'
          $pdfiumProbe = Join-Path $PWD 'build/ci-Release/Release/atlas_pdfium_probe.exe'
          $pdfiumDll = Join-Path $PWD 'build/ci-Release/Release/pdfium.dll'
          foreach ($required in @($exe, $qtProbe, $pdfiumProbe, $pdfiumDll)) {
            if (-not (Test-Path $required)) {
              throw "Required Release artifact not found at $required"
            }
          }

          Copy-Item $exe (Join-Path $stage 'atlas_reader.exe')
          Copy-Item 'qt.conf' (Join-Path $stage 'qt.conf')
          Copy-Item $qtProbe (Join-Path $qtProbeStage 'atlas_qt_pdf_probe.exe')
          Copy-Item $pdfiumProbe (Join-Path $pdfiumProbeStage 'atlas_pdfium_probe.exe')
          Copy-Item $pdfiumDll (Join-Path $pdfiumProbeStage 'pdfium.dll')
          Copy-Item 'docs/N2_PDF_ENGINE_QUALIFICATION_PLAN.md' (Join-Path $docs 'N2_PDF_ENGINE_QUALIFICATION_PLAN.md')
          Copy-Item 'docs/baselines/N2_PDF_ENGINE_MATRIX.md' (Join-Path $docs 'N2_PDF_ENGINE_MATRIX.md')
          Copy-Item 'docs/baselines/N2_PDFIUM_PROVENANCE.md' (Join-Path $docs 'N2_PDFIUM_PROVENANCE.md')
          Copy-Item 'tests/fixtures/pdf/manifest.json' (Join-Path $fixtureStage 'manifest.json')
          Copy-Item 'tests/fixtures/pdf/generated/*.pdf' $fixtureStage
          if (Test-Path 'artifacts/n2/fixture-validation.json') {
            Copy-Item 'artifacts/n2/fixture-validation.json' (Join-Path $stage 'evidence/fixture-validation.json')
          }

          $fixtureRoot = Join-Path $PWD 'tests/fixtures/pdf/generated'
          $probeCases = @(
            @{
              Id = 'A001'; File = 'A001_simple_text.pdf'; QtLinkCount = '0'; PdfiumLinkCount = '0'
              Args = @('--expect-pages','1','--expect-labels','1','--expect-text-contains','Atlas N2 Fixture A001','--expect-outline-count','0','--render-page','0','--render-width','612','--render-height','792')
            },
            @{
              Id = 'A002'; File = 'A002_geometry_labels.pdf'; QtLinkCount = '0'; PdfiumLinkCount = '0'
              Args = @('--expect-pages','3','--expect-labels','i,ii,1','--expect-text-contains','Atlas N2 Fixture A002 page 1','--expect-outline-count','0')
            },
            @{
              Id = 'A003'; File = 'A003_outlines_links.pdf'; QtLinkCount = '3'; PdfiumLinkCount = '2'
              Args = @('--expect-pages','3','--expect-labels','1,2,3','--expect-text-contains','Atlas N2 Fixture A003 page 1','--expect-outline-count','3','--expect-outline-titles','Chapter 1|Section 1.1|Chapter 2','--expect-outline-depths','0,1,0','--expect-outline-pages','0,1,2','--expect-internal-link-page','2','--expect-external-uri','https://example.com/atlas-n2-fixture')
            },
            @{
              Id = 'A004'; File = 'A004_outlines_only.pdf'; QtLinkCount = '0'; PdfiumLinkCount = '0'
              Args = @('--expect-pages','3','--expect-labels','1,2,3','--expect-text-contains','Atlas N2 Fixture A004 page 1','--expect-outline-count','3','--expect-outline-titles','Chapter 1|Section 1.1|Chapter 2','--expect-outline-depths','0,1,0','--expect-outline-pages','0,1,2')
            },
            @{
              Id = 'A005'; File = 'A005_links_only.pdf'; QtLinkCount = '3'; PdfiumLinkCount = '2'
              Args = @('--expect-pages','3','--expect-labels','1,2,3','--expect-text-contains','Atlas N2 Fixture A005 page 1','--expect-outline-count','0','--expect-internal-link-page','2','--expect-external-uri','https://example.com/atlas-n2-fixture')
            }
          )

          foreach ($case in $probeCases) {
            $fixture = Join-Path $fixtureRoot $case.File
            $qtArgs = @('--fixture-id', $case.Id) + $case.Args + @('--expect-link-count', $case.QtLinkCount) + @($fixture)
            $pdfiumArgs = @('--fixture-id', $case.Id) + $case.Args + @('--expect-link-count', $case.PdfiumLinkCount) + @($fixture)

            $qtOutput = Join-Path $qtEvidence "$($case.Id).json"
            & $qtProbe @qtArgs | Set-Content -Encoding UTF8 $qtOutput
            if ($LASTEXITCODE -ne 0) {
              Get-Content $qtOutput
              throw "Qt PDF probe failed for fixture $($case.Id) with exit code $LASTEXITCODE"
            }
            Write-Host "Qt PDF probe PASS: $($case.Id) -> $qtOutput"

            $pdfiumOutput = Join-Path $pdfiumEvidence "$($case.Id).json"
            & $pdfiumProbe @pdfiumArgs | Set-Content -Encoding UTF8 $pdfiumOutput
            if ($LASTEXITCODE -ne 0) {
              Get-Content $pdfiumOutput
              throw "PDFium probe failed for fixture $($case.Id) with exit code $LASTEXITCODE"
            }
            Write-Host "PDFium probe PASS: $($case.Id) -> $pdfiumOutput"
          }

          $deploy = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          & $deploy --release --qmldir (Join-Path $PWD 'qml') (Join-Path $stage 'atlas_reader.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for atlas_reader with exit code $LASTEXITCODE" }
          & $deploy --release (Join-Path $qtProbeStage 'atlas_qt_pdf_probe.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for atlas_qt_pdf_probe with exit code $LASTEXITCODE" }
          & $deploy --release (Join-Path $pdfiumProbeStage 'atlas_pdfium_probe.exe')
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed for atlas_pdfium_probe with exit code $LASTEXITCODE" }

          @(
            'Atlas Reader Native N2 Windows engineering artifact'
            'Version: 2.0.0-alpha.2'
            'Checkpoint: N2 PDF engine qualification spike'
            "Implementation head SHA: $env:ATLAS_IMPLEMENTATION_SHA"
            "Checkout SHA: $env:ATLAS_CHECKOUT_SHA"
            'GitHub run: ${{ github.run_id }}'
            'Configuration: Release'
            'Generator: Visual Studio 17 2022 x64'
            'Qt baseline: 6.10.3 MSVC 2022 64-bit'
            'N2.1 probe: Qt PDF 6.10.3 via qtpdf module'
            'N2.2 probe: PDFium 156.0.8066.0 / chromium/8066 via pinned bblanchon Windows x64 package'
            'Navigation evidence: raw engine link rows preserved; semantic destination/URI assertions shared on A003-A005'
            'PDFium archive SHA-256: 739a57d597d864297909cc40a2411eba728490c76a0fa25e3ea299c7f6b07020'
            'PDFium call model: serialized single-thread only'
            'Product shell Qt PDF linkage: none'
            'Product shell PDFium linkage: none'
            'Fixture integrity gate: pypdf 5.9.0 + manifest SHA-256'
            'A006 fixture policy: deterministically regenerated from checked-in source before validation/tests'
            'Controls style: compile-time Basic'
            'Inherited Windows font backend: GDI via qt.conf'
            'PDF engine production selection: none; ADR-0004 remains Proposed'
            'Purpose: N2 engineering/CI evidence only; not a user release and not N1 requalification'
          ) | Set-Content -Encoding UTF8 (Join-Path $stage 'N2_BUILD_INFO.txt')

      - name: Upload N2 Windows engineering artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-reader-n2-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifact/n2-windows-x64
          if-no-files-found: error
          retention-days: 14