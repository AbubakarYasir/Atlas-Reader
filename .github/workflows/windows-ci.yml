name: Windows CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # Pin the image because the Qt kit is the MSVC 2022 x64 build. Avoid
    # windows-latest silently moving the bootstrap onto a different VS toolset.
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Qt 6.11.x is the preferred product-generation line, but as of the
      # 2026-09 bootstrap aqt/install-qt-action cannot reliably install the
      # Windows 6.11 repository from the public mirror. Keep public CI on the
      # last reproducibly installable compatible patch and re-qualify 6.11.x
      # in N1 rather than requiring private Qt account secrets in public CI.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S . -B build/ci
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        shell: pwsh
        run: cmake --build build/ci --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci -C Release --output-on-failure
